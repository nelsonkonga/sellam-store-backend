name: Deploy Backend to AlwaysData

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Étape 1 de Claude : Vérifier s'il y a des conflits de fichiers
      - name: Debug - list workflow files
        run: |
          echo "=== Fichiers de workflow présents ==="
          ls -la .github/workflows/
          echo "=== Branche actuelle ==="
          git branch --show-current

      # Étape 2 de Claude : Forcer proprement Temurin Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Étape 3 de Claude : Afficher la version réelle dans la console
      - name: Verify Java version actually active
        run: |
          echo "JAVA_HOME = $JAVA_HOME"
          java -version

      - name: Build with Maven
        run: mvn clean package -DskipTests -Dmaven.test.skip=true

      - name: Upload JAR via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          protocol: ftp
          local-dir: ./target/
          server-dir: ./
          file-name-regex: '.*\.jar$'
