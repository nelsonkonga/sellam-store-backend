# Configuration PostgreSQL pour test Phase 1 avec migration_identity.sql exécutée
# 
# PRÉREQUIS :
# 1. PostgreSQL doit être installé et accessible
# 2. Créer la base de données : CREATE DATABASE sellam;
# 3. Exécuter migration_identity.sql sur cette base
# 4. Configurer les identifiants ci-dessous selon votre environnement
#
# Commande de test PostgreSQL :
# psql -U postgres -d sellam -f migration_identity.sql

spring.datasource.url=jdbc:postgresql://localhost:5432/sellam
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

spring.data.jpa.repositories.bootstrap-mode=deferred

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC+1

jwt.secret=${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${REDIRECT_URL:http://localhost:8080/login/oauth2/code/google}

spring.mail.host=smtp.gmail.com
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:test@example.com}
spring.mail.password=${SMTP_PASSWORD:test-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.socketFactory.port=587
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.registration.blocked=true

supabase.url=${SUPABASE_URL:http://localhost:54321}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:test-service-role-key}

management.health.mail.enabled=false

app.vapid.subject=${VAPID_SUBJECT:mailto:test@example.com}
app.vapid.public-key=${VAPID_PUBLIC_KEY:test-vapid-public-key}
app.vapid.private-key=${VAPID_PRIVATE_KEY:test-vapid-private-key}

socketio.host=${SOCKETIO_HOST:localhost}
socketio.port=9092
