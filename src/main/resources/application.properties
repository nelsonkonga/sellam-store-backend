spring.application.name=ProductsBackend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

spring.data.jpa.repositories.bootstrap-mode=deferred

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC+1

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${REDIRECT_URL}

# Augmente le timeout pour Google OIDC JWT verification (par défaut 30s)
# Utile pour les environnements lents ou les VPN
server.tomcat.connection-timeout=30000

# Profil actif par défaut (local si non défini). En production, il faut définir SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Configuration socket pour les requêtes HTTP
spring.http.client.connect-timeout=10000
spring.http.client.read-timeout=20000
#spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
#spring.security.oauth2.client.registration.google.client-name=Google
#spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
#spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
#spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
#spring.security.oauth2.client.provider.google.user-name-attribute=name
#spring.security.oauth2.client.provider.google.user-info-authentication-method=heade

spring.mail.host=smtp.gmail.com
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.socketFactory.port=587
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://sellam-store.vercel.app,https://sellam.store}

supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

management.health.mail.enabled=false

app.vapid.subject=${VAPID_SUBJECT}
app.vapid.public-key=${VAPID_PUBLIC_KEY}
app.vapid.private-key=${VAPID_PRIVATE_KEY}

socketio.host=${SOCKETIO_HOST}
socketio.port=9092

# --- Abonnement ---
app.subscription.trial-days=14
app.subscription.warning-before-days=3
app.subscription.grace-days=3
app.subscription.plan-duration-days=30
app.subscription.plan-amount-xaf=1000

# --- Parrainage ---
app.referral.bonus-days-referrer=15
app.referral.bonus-days-referee=15

# --- Payment Integration ---
payment-integration.api-key=${PAYMENT_INTEGRATION_API_KEY:dummy-api-key}
payment-integration.site-id=${PAYMENT_INTEGRATION_SITE_ID:dummy-site-id}
payment-integration.secret-key=${PAYMENT_INTEGRATION_SECRET_KEY:dummy-secret-key}
payment-integration.base-url=https://api.cinetpay.net
payment-integration.currency=XAF
payment-integration.notify-url=${PAYMENT_INTEGRATION_NOTIFY_URL:http://localhost:8080/notify}
payment-integration.return-url=${FRONTEND_URL:http://localhost:5173}/subscription/payment-callback

app.manual-payment.mobile-money-number=659300327
app.manual-payment.mobile-money-holder-name=KONGA KAMDEM
app.manual-payment.mobile-money-operator=Orange Money
app.manual-payment.support-contact-url=/support/tickets/new



